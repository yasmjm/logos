<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Logos: central de resposta a incidentes da frota." />
    <title>Logos · Central de Incidentes</title>
    <script>
      // Apply the saved theme before the first paint (no flash). Storage may be blocked.
      try {
        var saved = localStorage.getItem('logos.theme')
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.dataset.theme = saved
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
